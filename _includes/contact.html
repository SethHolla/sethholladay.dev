<div id="contact" class="modal fade" role="dialog">
    <div class="modal-dialog modal-md">

        <div class="modal-content">

            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
            </div>

            <div class="modal-body">

                <form class="form-horizontal form-contact clearfix" action="https://formspree.io/sethholladay6@gmail.com" method="POST">

                    <div class="form-group">
                        <label class="message-label" for="name">Get in Touch</label>
                        <input id="name" type="text" class="name form-control" name="name" placeholder="Your Full Name" autocomplete="name" required>
                        <label for="email" class="sr-only">Email</label>
                        <input id="email" type="email" class="email form-control" name="_replyto" placeholder="Your Email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message" class="sr-only">Message</label>
                        <textarea id="message" class="message form-control" rows="8" name="body" placeholder="Your Message" required></textarea>
                    </div>

                    <input type="submit" class="btn btn-default" style="float: right" value="Send">

                </form>

            </div>

        </div>

    </div>
</div>
